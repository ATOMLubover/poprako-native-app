<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计卡片设计示例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@500;600;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        /* 基础卡片样式 */
        .overview-card {
            position: relative;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 28px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* 悬停效果：轻微放大并加强投影 */
        .overview-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px var(--shadow-color);
        }

        /* 卡片内的彩色背景装饰（左上角渐变） */
        .card-bg-decoration {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 100px;
            height: 100px;
            background: var(--theme-color);
            filter: blur(40px);
            opacity: 0.12;
            z-index: 0;
        }

        /* 玻璃感装饰图标（右侧大图标） */
        .glass-icon {
            position: absolute;
            right: -10px;
            bottom: -10px;
            width: 80px;
            height: 80px;
            color: var(--theme-color);
            opacity: 0.08;
            transform: rotate(-15deg);
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: block;
        }

        .value {
            font-size: 32px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 8px;
        }

        .trend {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend.up { color: #10b981; }
        .trend.down { color: #f43f5e; }

        /* 主题颜色定义 */
        .theme-green { 
            --theme-color: #749577; 
            --shadow-color: rgba(116, 149, 119, 0.2);
        }
        .theme-blue { 
            --theme-color: #7091b1; 
            --shadow-color: rgba(112, 145, 177, 0.2);
        }
        .theme-purple { 
            --theme-color: #9089ad; 
            --shadow-color: rgba(144, 137, 173, 0.2);
        }
        .theme-yellow { 
            --theme-color: #b5a46d; 
            --shadow-color: rgba(181, 164, 109, 0.2);
        }
        /* 新增：术语库主题色（橙色） */
        .theme-orange {
            --theme-color: #e67e5f;
            --shadow-color: rgba(230, 126, 95, 0.2);
        }

    </style>
</head>
<body>

    <div class="stats-container">
        
        <!-- 活跃团队 -->
        <div class="overview-card theme-green">
            <div class="card-bg-decoration"></div>
            <svg class="glass-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <div class="card-content">
                <span class="label">活跃团队</span>
                <div class="value">24</div>
                <div class="trend up">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"></path></svg>
                    <span>+12.5%</span>
                </div>
            </div>
        </div>

        <!-- 已发布作品 -->
        <div class="overview-card theme-blue">
            <div class="card-bg-decoration"></div>
            <svg class="glass-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.168.477-4.5 1.253"></path></svg>
            <div class="card-content">
                <span class="label">发布作品</span>
                <div class="value">1,402</div>
                <div class="trend up">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"></path></svg>
                    <span>+28.4%</span>
                </div>
            </div>
        </div>

        <!-- 术语库 - 新增卡片 -->
        <div class="overview-card theme-orange">
            <div class="card-bg-decoration"></div>
            <!-- 拟态图标：书籍 + 字符 A -->
            <svg class="glass-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.168.477-4.5 1.253M14 10l2 2m0 0l2 2m-2-2l-2 2m2-2l2-2"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10h.01M9 13h.01M9 16h.01M15 10h.01M15 13h.01M15 16h.01"></path>
            </svg>
            <div class="card-content">
                <span class="label">术语库</span>
                <div class="value">8,240</div>
                <div class="trend up">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"></path></svg>
                    <span>+142</span>
                </div>
            </div>
        </div>

        <!-- 待办审核 -->
        <div class="overview-card theme-purple">
            <div class="card-bg-decoration"></div>
            <svg class="glass-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="card-content">
                <span class="label">待办审核</span>
                <div class="value">89</div>
                <div class="trend down">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12 13a1 1 0 110 2h-5a1 1 0 01-1-1v-5a1 1 0 112 0v2.586l4.293-4.293a1 1 0 011.414 0L12 9.586l4.293-4.293a1 1 0 111.414 1.414l-5 5a1 1 0 01-1.414 0L9 9.414 5.414 13H12z" clip-rule="evenodd"></path></svg>
                    <span>-5.2%</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
