<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侧边栏极简自然版</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --sidebar-width-collapsed: 70px;
            --sidebar-width-expanded: 240px;
            
            /* 自然配色方案 - 基于 Morning Mist 与 Warm Sand */
            --bg-page: #f8f9f8;          /* 极浅的自然绿底色 */
            --bg-sidebar: #ffffff;
            --text-main: #2e3c33;        /* 深森林绿，代替纯黑 */
            --text-muted: #7a8c80;       /* 灰绿色，代替纯灰 */
            --accent-bg: #e3f2e5;        /* 晨雾绿背景 */
            --accent-border: #c8e6c9;    /* 晨雾绿边框 */
            --accent-text: #2e5c33;      /* 晨雾绿文字 */
            --item-hover: #f0f4f1;       /* 极浅的悬停色 */
            --border-color: #e9edea;     /* 浅灰绿边框 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* 侧边栏主体 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: var(--sidebar-width-collapsed);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar:hover {
            width: var(--sidebar-width-expanded);
            box-shadow: 10px 0 30px rgba(46, 60, 51, 0.03);
        }

        /* Logo 区域 */
        .logo-section {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 23px;
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .logo-icon {
            color: var(--accent-text);
            flex-shrink: 0;
            stroke-width: 2px;
        }

        .logo-text {
            margin-left: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.2px;
            color: var(--text-main);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sidebar:hover .logo-text {
            opacity: 1;
        }

        /* 导航列表 */
        .nav-list {
            list-style: none;
            padding: 0;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            height: 48px;
            margin: 4px 10px;
            border-radius: 999px; /* 采用 Tag 按钮的完全圆角 */
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: var(--text-muted);
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--item-hover);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        /* 激活状态参考了你提供的 Theme Mist 风格 */
        .nav-item.active {
            background-color: var(--accent-bg);
            border-color: var(--accent-border);
            color: var(--accent-text);
        }

        /* 图标盒子 */
        .icon-box {
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box i {
            stroke-width: 1.8px;
            width: 19px;
            height: 19px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item:hover .icon-box i {
            transform: scale(1.15) rotate(-5deg);
        }

        .nav-text {
            margin-left: 2px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transform: translateX(-5px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transform: translateX(0);
        }

        /* 底部操作区 */
        .footer-section {
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
        }

        /* 主要内容区域 */
        .main-content {
            margin-left: var(--sidebar-width-collapsed);
            padding: 60px;
            width: 100%;
            transition: margin-left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .content-header {
            max-width: 900px;
            margin-bottom: 40px;
        }

        .content-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .content-header p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 卡片风格也进行了自然化重构 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 900px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-border);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 60, 51, 0.02);
        }

        .card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 1.6rem;
            color: var(--text-main);
            font-weight: 600;
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-section">
            <i data-lucide="leaf" class="logo-icon"></i>
            <span class="logo-text">Nature Flow</span>
        </div>

        <ul class="nav-list">
            <li>
                <a href="#" class="nav-item active">
                    <span class="icon-box"><i data-lucide="layout-dashboard"></i></span>
                    <span class="nav-text">实时概览</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <span class="icon-box"><i data-lucide="message-square"></i></span>
                    <span class="nav-text">互动消息</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <span class="icon-box"><i data-lucide="bar-chart-3"></i></span>
                    <span class="nav-text">增长数据</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <span class="icon-box"><i data-lucide="layers"></i></span>
                    <span class="nav-text">资源库</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <span class="icon-box"><i data-lucide="settings-2"></i></span>
                    <span class="nav-text">偏好设置</span>
                </a>
            </li>
        </ul>

        <div class="footer-section">
            <a href="#" class="nav-item">
                <span class="icon-box"><i data-lucide="power"></i></span>
                <span class="nav-text">退出系统</span>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <header class="content-header">
            <h1>工作台</h1>
            <p>享受自然呼吸感的工作环境。每一个细节都经过调校，为您减少视觉疲劳。</p>
        </header>

        <div class="grid">
            <div class="card">
                <h3>活跃订阅</h3>
                <p class="value">2,540</p>
            </div>
            <div class="card">
                <h3>生态指数</h3>
                <p class="value">98.2%</p>
            </div>
            <div class="card">
                <h3>服务器负载</h3>
                <p class="value" style="color: #6b8e6d;">稳定</p>
            </div>
        </div>
    </main>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 导航切换逻辑
        document.querySelectorAll('.nav-list .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const currentActive = document.querySelector('.nav-item.active');
                if(currentActive) currentActive.classList.remove('active');
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
