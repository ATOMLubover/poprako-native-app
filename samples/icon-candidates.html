<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简自然风图标选择器</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* 自然配色方案 - 晨雾绿 (Morning Mist) */
            --bg-page: #f8f9f8;
            --text-main: #2e3c33;
            --text-muted: #7a8c80;
            --accent-bg: #e3f2e5;
            --accent-border: #c8e6c9;
            --accent-text: #2e5c33;
            --card-bg: #ffffff;
            --border-color: #e9edea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .icon-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 20px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 悬停效果：参考你提供的 Tag 按钮逻辑 */
        .icon-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-border);
            background-color: var(--accent-bg);
            box-shadow: 0 12px 30px rgba(46, 60, 51, 0.05);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-card:hover .icon-wrapper {
            transform: scale(1.2) rotate(-5deg);
        }

        .icon-wrapper i {
            stroke-width: 1.5px; /* 极简精致线条 */
            width: 48px;
            height: 48px;
        }

        .icon-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .icon-info code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background: rgba(0, 0, 0, 0.04);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .icon-card:hover .icon-info code {
            background: rgba(46, 92, 51, 0.1);
            color: var(--accent-text);
        }

        /* 底部反馈 */
        .copy-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: white;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>图标选型指南</h1>
            <p>选择最符合你设计意象的自然元素图标</p>
        </header>

        <div class="icon-grid">
            <!-- 树木/白杨类 -->
            <div class="icon-card" onclick="copyToClipboard('tree-pine')">
                <div class="icon-wrapper"><i data-lucide="tree-pine"></i></div>
                <div class="icon-info">
                    <h3>Tree Pine (白杨/松树)</h3>
                    <code>tree-pine</code>
                </div>
            </div>

            <!-- 叶子类 -->
            <div class="icon-card" onclick="copyToClipboard('leaf')">
                <div class="icon-wrapper"><i data-lucide="leaf"></i></div>
                <div class="icon-info">
                    <h3>Leaf (叶子)</h3>
                    <code>leaf</code>
                </div>
            </div>

            <!-- 森林类 -->
            <div class="icon-card" onclick="copyToClipboard('trees')">
                <div class="icon-wrapper"><i data-lucide="trees"></i></div>
                <div class="icon-info">
                    <h3>Trees (森林)</h3>
                    <code>trees</code>
                </div>
            </div>

            <!-- 嫩芽类 -->
            <div class="icon-card" onclick="copyToClipboard('sprout')">
                <div class="icon-wrapper"><i data-lucide="sprout"></i></div>
                <div class="icon-info">
                    <h3>Sprout (嫩芽)</h3>
                    <code>sprout</code>
                </div>
            </div>

            <!-- 三叶草类 -->
            <div class="icon-card" onclick="copyToClipboard('clover')">
                <div class="icon-wrapper"><i data-lucide="clover"></i></div>
                <div class="icon-info">
                    <h3>Clover (三叶草)</h3>
                    <code>clover</code>
                </div>
            </div>

            <!-- 花卉/对称类 -->
            <div class="icon-card" onclick="copyToClipboard('flower-2')">
                <div class="icon-wrapper"><i data-lucide="flower-2"></i></div>
                <div class="icon-info">
                    <h3>Flower (花卉)</h3>
                    <code>flower-2</code>
                </div>
            </div>
        </div>
    </div>

    <div id="copy-hint" class="copy-hint">已复制图标 ID</div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 简单的复制反馈逻辑
        function copyToClipboard(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            const hint = document.getElementById('copy-hint');
            hint.style.opacity = '1';
            setTimeout(() => {
                hint.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
