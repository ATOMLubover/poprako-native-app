<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用信息弹窗组件</title>
    <style>
        :root {
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-light: #ffffff;
            --text-dark: #1f2937;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }

        /* 按钮样式 */
        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-success { background-color: var(--success-color); }
        .btn-error { background-color: var(--error-color); }

        /* 弹窗容器 */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        /* 单个弹窗样式 */
        .toast {
            pointer-events: auto;
            min-width: 280px;
            max-width: 450px;
            background: var(--bg-light);
            color: var(--text-dark);
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            animation: slideIn 0.3s ease-out forwards;
        }

        .toast.hiding {
            animation: slideOut 0.3s ease-in forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .toast-message {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 移除边框，仅通过文字颜色或底边进度条区分 */
        .toast-success .toast-message { color: var(--success-color); }
        .toast-error .toast-message { color: var(--error-color); }

        /* 关闭按钮 */
        .toast-close {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.2rem;
            padding-left: 15px;
            line-height: 1;
        }

        .toast-close:hover {
            color: var(--text-dark);
        }

        /* 进度条动画 */
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(0,0,0,0.03);
        }

        .toast-progress-bar {
            height: 100%;
            width: 100%;
            transform-origin: left;
        }

        .toast-success .toast-progress-bar { background: var(--success-color); }
        .toast-error .toast-progress-bar { background: var(--error-color); }

        /* 响应式适配 */
        @media (max-width: 480px) {
            #toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
            }
            .toast {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-success" onclick="showToast('success', '操作成功！数据已同步。')">测试成功弹窗</button>
        <button class="btn-error" onclick="showToast('error', '操作失败。请检查您的网络连接。')">测试失败弹窗</button>
    </div>

    <!-- 弹窗挂载点 -->
    <div id="toast-container"></div>

    <script>
        /**
         * 显示弹窗函数
         * @param {string} type - 样式类型 ('success' | 'error')
         * @param {string} message - 显示的文本内容
         * @param {number} duration - 持续时间(ms)，默认3000
         */
        function showToast(type, message, duration = 3000) {
            const container = document.getElementById('toast-container');
            
            // 创建弹窗元素
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            toast.innerHTML = `
                <span class="toast-message">${message}</span>
                <button class="toast-close">&times;</button>
                <div class="toast-progress">
                    <div class="toast-progress-bar"></div>
                </div>
            `;

            container.appendChild(toast);

            // 进度条动画实现
            const progressBar = toast.querySelector('.toast-progress-bar');
            progressBar.style.transition = `transform ${duration}ms linear`;
            
            requestAnimationFrame(() => {
                progressBar.style.transform = 'scaleX(0)';
            });

            // 定时自动关闭
            const timer = setTimeout(() => {
                closeToast(toast);
            }, duration);

            // 手动关闭
            toast.querySelector('.toast-close').onclick = () => {
                clearTimeout(timer);
                closeToast(toast);
            };
        }

        function closeToast(toast) {
            if (toast.classList.contains('hiding')) return;
            toast.classList.add('hiding');
            toast.addEventListener('animationend', () => {
                toast.remove();
            });
        }
    </script>
</body>
</html>
