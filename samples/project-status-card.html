<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mono-icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .progress-mini {
            width: 60px;
            height: 3px;
            background: #eee;
            border-radius: 2px;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #000;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <!-- 极简 Project Item -->
    <div class="flex items-center gap-4 px-4 py-3 bg-white border-b border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer group">
        
        <!-- 1. 状态图标 (本地/远程) -->
        <div class="text-gray-400 group-hover:text-black shrink-0">
            <svg class="mono-icon" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <path d="M12 17v4M8 21h8" />
            </svg>
        </div>

        <!-- 2. 作者与标题 (主文本) -->
        <div class="grow min-w-0">
            <div class="flex items-center gap-1 overflow-hidden">
                <span class="text-base font-semibold text-gray-400 shrink-0">【米二】</span>
                <span class="text-base font-semibold text-gray-900 truncate">一人之下 - 第560话.cbr</span>
            </div>
        </div>

        <!-- 3. 数据指标 (图标化提示) -->
        <div class="flex items-center gap-4 text-sm font-medium text-gray-600 shrink-0 px-2">
            <!-- 页数图标 (Book Open) -->
            <div class="flex items-center gap-1.5">
                <svg class="mono-icon text-gray-400" viewBox="0 0 24 24">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                </svg>
                <span>24</span>
            </div>
            <!-- 翻译单元图标 (Circle A) -->
            <div class="flex items-center gap-1.5">
                <svg class="mono-icon text-gray-400" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 16l4-8 4 8M9 13h6" />
                </svg>
                <span>142</span>
            </div>
        </div>

        <!-- 4. 进度组 (TR/PR 并列) -->
        <div class="flex items-center gap-6 shrink-0 ml-4 border-l border-gray-100 pl-6">
            <!-- 翻译进度 -->
            <div class="flex items-center gap-3">
                <span class="text-[11px] font-black text-gray-300 tracking-tighter">TR</span>
                <div class="flex flex-col gap-1">
                    <div class="progress-mini"><div class="progress-fill" style="width: 85%"></div></div>
                    <span class="text-[11px] font-bold text-gray-700 leading-none">85%</span>
                </div>
            </div>
            <!-- 校对进度 -->
            <div class="flex items-center gap-3">
                <span class="text-[11px] font-black text-gray-300 tracking-tighter">PR</span>
                <div class="flex flex-col gap-1">
                    <div class="progress-mini"><div class="progress-fill opacity-30" style="width: 40%"></div></div>
                    <span class="text-[11px] font-bold text-gray-700 leading-none">40%</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
