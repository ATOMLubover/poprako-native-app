<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯净自然风格抽卡悬浮窗</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-card-bg: #ffffff;
            --secondary-card-bg: #fafbfc;
            --accent-color: #8da9c4;
            --text-main: #2d3142;
            --text-sub: #909399;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-strong: 0 15px 45px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.6s;
            --bezier: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 容器定义 */
        .widget-container {
            position: relative;
            width: 320px;
            height: 200px;
            display: flex;
            align-items: center;
        }

        /* 基础卡片样式 */
        .card {
            position: absolute;
            border-radius: 24px;
            transition: all var(--transition-speed) var(--bezier);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 后置卡片 (待抽出的部分) */
        .card-secondary {
            z-index: 1;
            width: 100%;
            height: 90%;
            background-color: var(--secondary-card-bg);
            left: 15px; /* 默认只露出一点边缘 */
            box-shadow: var(--shadow-soft);
            opacity: 0.8;
            transform: scale(0.95);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 前置主卡片 */
        .card-primary {
            z-index: 2;
            width: 100%;
            height: 100%;
            background-color: var(--primary-card-bg);
            box-shadow: var(--shadow-strong);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        /* 展开状态逻辑 */
        .widget-container.expanded .card-secondary {
            left: 280px; /* 抽出后的位置 */
            opacity: 1;
            transform: scale(1);
            box-shadow: var(--shadow-strong);
        }

        .widget-container.expanded .card-primary {
            transform: translateX(-20px);
        }

        /* 内容样式 */
        .card-title {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.5;
        }

        /* 按钮设计 */
        .action-btn {
            margin-top: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            width: fit-content;
            transition: transform 0.2s ease, background-color 0.3s ease;
            outline: none;
        }

        .action-btn:hover {
            background-color: #7a97b3;
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* 装饰用的小图标 */
        .icon-indicator {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 40px;
            background: rgba(0,0,0,0.05);
            border-radius: 2px;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .widget-container {
                width: 260px;
            }
            .widget-container.expanded .card-secondary {
                left: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="widget-container" id="widget">
        <!-- 后置卡片 -->
        <div class="card card-secondary">
            <div class="card-title">附加信息</div>
            <p class="card-desc">这里是隐藏的内容，可以通过点击按钮滑出查看详情。</p>
        </div>

        <!-- 前置主卡片 -->
        <div class="card card-primary">
            <div class="card-title">自然设计</div>
            <p class="card-desc">探索极简主义的交互美学，感受纯净的界面体验。</p>
            <button class="action-btn" id="toggleBtn">点击展开</button>
            <div class="icon-indicator"></div>
        </div>
    </div>

    <script>
        const widget = document.getElementById('widget');
        const toggleBtn = document.getElementById('toggleBtn');
        let isExpanded = false;

        toggleBtn.addEventListener('click', () => {
            isExpanded = !isExpanded;
            
            if (isExpanded) {
                widget.classList.add('expanded');
                toggleBtn.textContent = '点击收回';
            } else {
                widget.classList.remove('expanded');
                toggleBtn.textContent = '点击展开';
            }
        });
    </script>
</body>
</html>
