<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原生文字选择器 - 晨雾风格版</title>
    <style>
        /* 引入 Inter 字体 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* 基础变量定义 - 采用参考风格配色 */
        :root {
            --primary-color: #749577; /* 晨雾绿深色 */
            --primary-bg: #E3F2E5;    /* 晨雾绿浅色 */
            --primary-border: #C8E6C9;
            --bg-page: #f0f4f8;       /* 极浅蓝灰色背景 */
            --text-main: #333333;
            --text-muted: #7d8995;
            --card-bg: #ffffff;
            --input-border: #DDE2E7;
            /* 柔和阴影 */
            --card-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-full: 999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
        }

        /* 布局容器 */
        .app-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 选择器主容器 */
        .selector-container {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 输入区域样式 */
        .input-wrapper {
            padding: 20px 20px 12px 20px;
        }

        .text-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fafbfc;
        }

        .text-input:focus {
            border-color: var(--primary-border);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(200, 230, 201, 0.3);
        }

        /* 提示词区域 (listHints) - 晨雾绿标签风格 */
        .hints-wrapper {
            padding: 4px 20px 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nature-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border: 2px solid var(--primary-border);
            border-radius: var(--radius-full);
            background-color: var(--primary-bg);
            color: var(--primary-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }

        .nature-tag:hover {
            transform: translateY(-1px);
            background-color: #D1E8D5;
            border-color: #bce0bd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .nature-tag:active {
            transform: translateY(0);
        }

        /* 纵向内容列表 */
        .content-list {
            max-height: 280px;
            overflow-y: auto;
            list-style: none;
            border-top: 1px solid #f0f3f5;
        }

        .list-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            font-size: 14px;
            border-bottom: 1px solid #fafbfc;
        }

        .list-item:hover {
            background-color: #f8fafc;
            padding-left: 24px; /* 轻微位移感 */
            color: var(--primary-color);
        }

        .list-item.active {
            background-color: var(--primary-bg);
            color: var(--primary-color);
            font-weight: 600;
        }

        .empty-state {
            padding: 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
        }

        /* 自定义滚动条 */
        .content-list::-webkit-scrollbar {
            width: 5px;
        }
        .content-list::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 10px;
        }

        /* 日志面板样式 */
        .log-panel {
            background: #ffffff;
            color: var(--text-main);
            padding: 20px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eef2f6;
        }

        .log-header {
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .log-header::before {
            content: "●";
            color: var(--primary-color);
        }

        #logOutput {
            font-family: 'Inter', monospace;
            line-height: 1.6;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px dashed #f0f0f0;
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 8px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- 文字选择器主体 -->
        <div id="textSelector" class="selector-container">
            <!-- 1. 输入框区域 -->
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="mainInput" 
                    class="text-input" 
                    placeholder="搜索或输入新内容..."
                    autocomplete="off"
                >
            </div>
            
            <!-- 2. 提示词区域 (直接堆叠，无滚动条) -->
            <div id="hintsContainer" class="hints-wrapper">
                <!-- 动态注入 nature-tag 风格的标签 -->
            </div>

            <!-- 3. 纵向列表区域 -->
            <ul id="listContainer" class="content-list">
                <!-- 动态注入列表项 -->
            </ul>
        </div>
    </div>

    <script>
        /**
         * 晨雾风格文字选择器
         */
        class TextSelector {
            constructor({ onEnter, listContent, listHints }) {
                this.onEnter = onEnter;
                this.fullList = listContent || [];
                this.hints = listHints || []; 
                
                this.filteredList = [...this.fullList];
                this.activeIndex = -1;

                this.input = document.getElementById('mainInput');
                this.hintsContainer = document.getElementById('hintsContainer');
                this.listContainer = document.getElementById('listContainer');
                this.container = document.getElementById('textSelector');

                this.init();
            }

            init() {
                this.renderHints();
                this.renderList();

                // 搜索过滤
                this.input.addEventListener('input', (e) => {
                    const value = e.target.value.toLowerCase();
                    this.filteredList = this.fullList.filter(item => 
                        item.toLowerCase().includes(value)
                    );
                    this.activeIndex = -1;
                    this.renderList();
                });

                // 键盘导航
                this.input.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'Enter':
                            this.handleEnter();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.navigate(1);
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.navigate(-1);
                            break;
                    }
                });
            }

            /**
             * 渲染提示标签
             */
            renderHints() {
                this.hintsContainer.innerHTML = '';
                if (this.hints.length === 0) {
                    this.hintsContainer.style.display = 'none';
                    return;
                }
                
                this.hintsContainer.style.display = 'flex';
                this.hints.forEach(hint => {
                    const btn = document.createElement('button');
                    btn.className = 'nature-tag';
                    btn.textContent = hint;
                    btn.onclick = () => {
                        this.input.value = hint;
                        this.input.focus();
                        this.input.dispatchEvent(new Event('input'));
                    };
                    this.hintsContainer.appendChild(btn);
                });
            }

            /**
             * 渲染纵向列表
             */
            renderList() {
                this.listContainer.innerHTML = '';
                
                if (this.filteredList.length === 0) {
                    this.listContainer.innerHTML = `<li class="empty-state">未发现匹配项</li>`;
                    return;
                }

                this.filteredList.forEach((text, index) => {
                    const li = document.createElement('li');
                    li.className = `list-item${index === this.activeIndex ? ' active' : ''}`;
                    li.textContent = text;
                    li.onclick = () => {
                        this.input.value = text;
                        this.activeIndex = index;
                        this.handleEnter();
                    };
                    this.listContainer.appendChild(li);
                });
            }

            navigate(direction) {
                if (this.filteredList.length === 0) return;
                this.activeIndex += direction;
                if (this.activeIndex < 0) this.activeIndex = this.filteredList.length - 1;
                if (this.activeIndex >= this.filteredList.length) this.activeIndex = 0;
                this.renderList();
                
                const activeElement = this.listContainer.children[this.activeIndex];
                if (activeElement) {
                    activeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            handleEnter() {
                let finalValue = this.input.value;
                if (this.activeIndex !== -1 && this.filteredList[this.activeIndex]) {
                    finalValue = this.filteredList[this.activeIndex];
                    this.input.value = finalValue;
                }

                if (this.onEnter && typeof this.onEnter === 'function') {
                    this.onEnter(finalValue);
                }

                // 简单的弹性缩放反馈
                this.container.style.transform = 'scale(0.99)';
                setTimeout(() => this.container.style.transform = 'scale(1)', 150);
            }
        }

        // --- 初始化与演示数据 ---

        const logAction = (str) => {
            const logOutput = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString([], { hour12: false });
            if (logOutput.innerText === '等待操作中...') logOutput.innerHTML = '';
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> 提交内容: <strong>${str}</strong>`;
            logOutput.prepend(entry);
        };

        const listContent = [
            "深色模式设计规范", "响应式布局进阶", "原生 JavaScript 动画",
            "CSS 变量最佳实践", "高性能 DOM 操作", "前端安全性指南",
            "语义化 HTML 结构", "跨域问题的终极方案", "现代浏览器渲染原理"
        ];

        const listHints = [
            "JavaScript", "CSS技巧", "React框架", "HTML5",
            "UI设计", "用户体验", "性能优化", "安全防范"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            new TextSelector({
                onEnter: logAction,
                listContent: listContent,
                listHints: listHints
            });
        });
    </script>
</body>
</html>
