<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>术语条目卡片 - 极简版</title>
    <style>
        /* 引入 Inter 字体 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-text: #1e293b;
            --secondary-text: #64748b;
            --border-color: #e2e8f0;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', -apple-system, "SF Pro SC", "HanHei SC", "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 极简版术语卡片主体 */
        .term-card-simple {
            width: 100%;
            max-width: 360px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            transition: var(--transition);
            cursor: pointer;
        }

        .term-card-simple:hover {
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 内容布局：原文与定义流式衔接 */
        .term-content {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .term-original {
            font-weight: 700;
            color: var(--primary-text);
            margin-right: 6px;
        }

        .term-definition {
            font-weight: 400;
            color: var(--secondary-text);
        }

    </style>
</head>
<body>

    <div id="term-container">
        <!-- 极简术语卡片将在这里渲染 -->
    </div>

    <script>
        /**
         * 模拟 Term 类型数据
         */
        const mockTerm = {
            original: "ふわふわ",
            definition: "形容柔软且轻盈的状态，常用于描述棉花糖或云朵。"
        };

        function createSimpleTermCard(term) {
            const container = document.getElementById('term-container');
            
            const html = `
                <div class="term-card-simple">
                    <div class="term-content">
                        <span class="term-original">${term.original}</span>
                        <span class="term-definition">${term.definition}</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        window.onload = () => createSimpleTermCard(mockTerm);
    </script>
</body>
</html>
