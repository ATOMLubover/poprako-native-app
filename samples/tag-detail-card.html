<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Detail Floating Window</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --card-bg: #ffffff;
            --primary-text: #2c3e50;
            --secondary-text: #7f8c8d;
            --time-text: #bdc3c7;
            /* Pica 风格粉色 (透明背景方案) */
            --pica-border: #ffdeeb;
            --pica-text: #d6336c;
            /* EHentai 风格蓝色 (透明背景方案) */
            --accent-breeze-border: #bbdefb;
            --accent-breeze-text: #54759e;
            
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .termbase-card {
            width: 320px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* 顶部标题行 */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 16px 12px 16px;
        }

        .term-name-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .term-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--primary-text);
            margin: 0;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 标签样式 - 仅保留边框和文字颜色 */
        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid transparent;
            background-color: transparent; /* 背景透明 */
            transition: opacity 0.16s;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        /* Pica 专用粉色标签 (无背景) */
        .tag-pica {
            border-color: var(--pica-border);
            color: var(--pica-text);
        }

        /* EH 专用蓝色标签 (无背景) */
        .tag-eh {
            border-color: var(--accent-breeze-border);
            color: var(--accent-breeze-text);
        }

        /* 铅笔按钮 */
        .edit-action-btn {
            color: var(--time-text);
            padding: 6px;
            border-radius: 8px;
            transition: var(--transition);
            flex-shrink: 0;
            margin-left: 8px;
            background-color: transparent;
        }

        .edit-action-btn:hover {
            /* 悬停时使用指定的浅绿色作为背景 */
            background-color: rgba(16, 185, 129, 0.1);
            /* 悬停时使用指定的颜色 #10b981 */
            color: #10b981;
            transform: scale(1.05);
        }

        /* 列表区域 */
        .comic-recommendation {
            background-color: #fafbfc;
            border-top: 1px solid #f1f3f5;
        }

        .comic-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #57606a;
            border-bottom: 1px solid #f1f3f5;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }

        .comic-item:last-child { border-bottom: none; }
        .comic-item:hover {
            background-color: #f1f8ff;
            color: var(--accent-breeze-text);
            cursor: pointer;
        }

        .comic-item::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--time-text);
            margin-right: 10px;
            flex-shrink: 0;
        }

        /* 标签混合排列容器 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            padding: 0 16px 8px 16px;
        }
    </style>
</head>
<body>

    <div class="termbase-card" id="tagCard">
        <!-- 头部区域 -->
        <div class="header-row">
            <div class="term-name-wrapper">
                <h1 class="term-name" id="tagName">加载中...</h1>
            </div>
            
            <!-- 铅笔修改按钮 -->
            <button class="edit-action-btn" title="修改标签配置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    <path d="m15 5 4 4"/>
                </svg>
            </button>
        </div>

        <!-- 标签混合容器：Pica 和 EH 标签顺次排列 -->
        <div class="tags-container" id="tagsBox">
            <!-- JS 填充 -->
        </div>

        <!-- 关联漫画列表 -->
        <div class="comic-recommendation">
            <div id="comicList">
                <!-- 长度为5的列表 -->
            </div>
        </div>
    </div>

    <script>
        const mockTag = {
            tagId: "t_001",
            name: "和服 (Kimono)",
            isPinned: true, 
            likedNum: 8420, 
            picaCandidates: ["和服", "传统服饰", "大和抚子"],
            ehentaiCandidates: ["kimono", "traditional clothes", "female:kimono"]
        };

        const mockComics = [
            "京都物语：樱花下的邂逅",
            "风铃馆的夏日回忆",
            "大正浪漫：银座的黄昏",
            "绸缎之梦",
            "和服少女的秘密花园"
        ];

        function render() {
            // 设置名称
            document.getElementById('tagName').textContent = mockTag.name;

            // 混合渲染所有标签
            const tagsBox = document.getElementById('tagsBox');
            let tagsHtml = '';

            // 渲染 Pica 标签
            if (mockTag.picaCandidates) {
                tagsHtml += mockTag.picaCandidates.map(t => 
                    `<span class="tag-pill tag-pica">${t}</span>`
                ).join('');
            }

            // 渲染 EHentai 标签 (紧跟其后)
            if (mockTag.ehentaiCandidates) {
                tagsHtml += mockTag.ehentaiCandidates.map(t => 
                    `<span class="tag-pill tag-eh">${t}</span>`
                ).join('');
            }

            tagsBox.innerHTML = tagsHtml;

            // 渲染漫画列表
            const list = document.getElementById('comicList');
            list.innerHTML = mockComics.slice(0, 5).map(name => 
                `<div class="comic-item">${name}</div>`
            ).join('');
        }

        window.onload = render;
    </script>
</body>
</html>
