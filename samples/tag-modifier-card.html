<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Modifier Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --card-bg: #ffffff;
            --primary-text: #2c3e50;
            --secondary-text: #7f8c8d;
            --border-color: #f1f3f5;
            
            /* Pica 风格粉色 */
            --pica-border: #ffdeeb;
            --pica-text: #d6336c;
            --pica-bg-hover: #fff0f6;
            
            /* EHentai 风格蓝色 */
            --accent-breeze-border: #bbdefb;
            --accent-breeze-text: #54759e;
            --eh-bg-hover: #e3f2fd;
            
            /* 交互绿色 */
            --confirm-green: #10b981;
            --confirm-green-light: rgba(16, 185, 129, 0.1);
            
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .modifier-card {
            width: 360px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 输入框样式 */
        .input-group {
            padding: 20px 20px 12px 20px;
        }

        .label-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--secondary-text);
            margin-bottom: 8px;
            display: block;
        }

        .name-input {
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
            transition: var(--transition);
        }

        .name-input:focus {
            border-color: var(--confirm-green);
            box-shadow: 0 0 0 3px var(--confirm-green-light);
        }

        /* 标签编辑区域 */
        .tags-section {
            padding: 0 20px 20px 20px;
        }

        .tag-editable-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 20px;
        }

        /* 统一的基础样式 */
        .tag-pill, .add-tag-trigger {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid transparent;
            background-color: transparent;
            transition: var(--transition);
        }

        .tag-pica { border-color: var(--pica-border); color: var(--pica-text); }
        .tag-eh { border-color: var(--accent-breeze-border); color: var(--accent-breeze-text); }

        .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .remove-btn:hover { opacity: 1; }

        /* 添加按钮基础样式：虚线 */
        .add-tag-trigger {
            border-style: dashed;
            border-color: var(--border-color);
            color: var(--secondary-text);
            cursor: pointer;
            user-select: none;
        }

        /* Pica 添加按钮 Hover：粉色系 */
        .add-pica-btn:hover {
            border-color: var(--pica-border);
            color: var(--pica-text);
            background-color: var(--pica-bg-hover);
        }

        /* EHentai 添加按钮 Hover：蓝色系 */
        .add-eh-btn:hover {
            border-color: var(--accent-breeze-border);
            color: var(--accent-breeze-text);
            background-color: var(--eh-bg-hover);
        }

        /* 底部按钮 */
        .action-footer {
            display: flex;
            padding: 12px 20px 20px 20px;
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            border: none;
        }

        .btn-cancel {
            background-color: #f8fafc;
            color: var(--secondary-text);
        }

        .btn-cancel:hover {
            background-color: #f1f3f5;
            color: var(--primary-text);
        }

        .btn-confirm {
            background-color: var(--confirm-green);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-confirm:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="modifier-card">
        <!-- 1. 修改名称 -->
        <div class="input-group">
            <input type="text" class="name-input" id="tagNameInput" value="和服 (Kimono)">
        </div>

        <!-- 2. Pica 标签编辑 -->
        <div class="tags-section">
            <label class="label-text">Pica 关联标签</label>
            <div class="tag-editable-list" id="picaList">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 3. EHentai 标签编辑 -->
        <div class="tags-section">
            <label class="label-text">EHentai 关联标签</label>
            <div class="tag-editable-list" id="ehList">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 4. 底部操作 -->
        <div class="action-footer">
            <button class="btn btn-cancel" onclick="handleCancel()">取消修改</button>
            <button class="btn btn-confirm" onclick="handleConfirm()">确认提交</button>
        </div>
    </div>

    <script>
        let picaTags = ["和服", "传统服饰", "大和抚子"];
        let ehTags = ["kimono", "female:kimono"];

        function renderTags() {
            const picaContainer = document.getElementById('picaList');
            const ehContainer = document.getElementById('ehList');

            // 渲染 Pica 标签和粉色 Hover 添加按钮
            let picaHtml = picaTags.map((tag, index) => `
                <div class="tag-pill tag-pica">
                    ${tag}
                    <span class="remove-btn" onclick="removeTag('pica', ${index})">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </span>
                </div>
            `).join('');
            picaHtml += `<div class="add-tag-trigger add-pica-btn" onclick="addNewTag('pica')">添加 +</div>`;
            picaContainer.innerHTML = picaHtml;

            // 渲染 EH 标签和蓝色 Hover 添加按钮
            let ehHtml = ehTags.map((tag, index) => `
                <div class="tag-pill tag-eh">
                    ${tag}
                    <span class="remove-btn" onclick="removeTag('eh', ${index})">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </span>
                </div>
            `).join('');
            ehHtml += `<div class="add-tag-trigger add-eh-btn" onclick="addNewTag('eh')">添加 +</div>`;
            ehContainer.innerHTML = ehHtml;
        }

        function removeTag(type, index) {
            if (type === 'pica') picaTags.splice(index, 1);
            else ehTags.splice(index, 1);
            renderTags();
        }

        function addNewTag(type) {
            const val = prompt("请输入新标签内容:");
            if (val && val.trim()) {
                if (type === 'pica') picaTags.push(val.trim());
                else ehTags.push(val.trim());
                renderTags();
            }
        }

        function handleCancel() {
            console.log("已取消修改");
        }

        function handleConfirm() {
            const newName = document.getElementById('tagNameInput').value;
            console.log("提交数据:", {
                name: newName,
                pica: picaTags,
                eh: ehTags
            });
        }

        window.onload = renderTags;
    </script>
</body>
</html>
