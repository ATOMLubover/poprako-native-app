<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉化编辑器卡片</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #374151;
            --text-muted: #9ca3af;
            --tag-in-bg: #fee2e2; /* 淡粉色 */
            --tag-in-text: #991b1b;
            --tag-out-bg: #fef3c7; /* 淡黄色 */
            --tag-out-text: #92400e;
            --accent-color: #3b82f6;
            --hover-bg: #f9fafb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        /* 核心卡片样式 */
        .editor-card {
            width: 100%;
            max-width: 500px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            /* 移除了 transition 和 focus-within 逻辑 */
        }

        /* 第一行：Index 和 Tag */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .index-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .status-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .tag-in {
            background-color: var(--tag-in-bg);
            color: var(--tag-in-text);
        }

        .tag-out {
            background-color: var(--tag-out-bg);
            color: var(--tag-out-text);
        }

        /* 第二行：特殊符号栏 */
        .symbol-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .symbol-btn {
            background: #f3f4f6;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.1s;
        }

        .symbol-btn:hover {
            background: #e5e7eb;
        }

        .symbol-btn:active {
            background: var(--text-muted);
            color: white;
        }

        /* 第三行：Textarea */
        .input-wrapper {
            position: relative;
        }

        .editor-textarea {
            width: 100%;
            box-sizing: border-box;
            height: 72px; /* 约3倍行高 */
            line-height: 24px;
            padding: 4px 0;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            color: var(--text-main);
            font-family: inherit;
            overflow-y: auto;
            background: transparent;
        }

        /* 自定义滚动条 */
        .editor-textarea::-webkit-scrollbar {
            width: 4px;
        }
        .editor-textarea::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 2px;
        }

        /* Mock 父组件通知显示 */
        .debug-panel {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            background: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="app-container" style="width: 100%; display: flex; justify-content: center;">
        <!-- 卡片将由 JS 渲染 -->
    </div>

    <script>
        /**
         * 模拟父组件注入的数据
         */
        const mockProps = {
            indexInPage: 4, 
            isInsideBox: true, 
            symbols: ['「', '」', '（', '）', '『', '』', '—', '…', '♪', '❤'],
            initialText: "这是一段待汉化的文本内容。",
            onTextModify: (newText) => {
                updateDebugDisplay(newText);
            }
        };

        function initEditor(props) {
            const container = document.getElementById('app-container');
            
            container.innerHTML = `
                <div class="editor-card">
                    <div class="card-header">
                        <span class="index-label">${String(props.indexInPage + 1).padStart(2, '0')}</span>
                        <span class="status-tag ${props.isInsideBox ? 'tag-in' : 'tag-out'}">
                            ${props.isInsideBox ? '框内' : '框外'}
                        </span>
                    </div>
                    <div class="symbol-bar" id="symbolBar">
                        ${props.symbols.map(s => `<button class="symbol-btn">${s}</button>`).join('')}
                    </div>
                    <div class="input-wrapper">
                        <textarea 
                            id="editorInput" 
                            class="editor-textarea" 
                            placeholder="请输入翻译..."
                        >${props.initialText}</textarea>
                    </div>
                </div>
              
            `;

            const textarea = document.getElementById('editorInput');
            const symbolBar = document.getElementById('symbolBar');

            textarea.addEventListener('input', (e) => {
                props.onTextModify(e.target.value);
            });

            symbolBar.addEventListener('click', (e) => {
                if (e.target.classList.contains('symbol-btn')) {
                    const symbol = e.target.textContent;
                    insertAtCursor(textarea, symbol);
                    props.onTextModify(textarea.value);
                }
            });
        }

        function insertAtCursor(myField, myValue) {
            const startPos = myField.selectionStart;
            const endPos = myField.selectionEnd;
            
            const beforeText = myField.value.substring(0, startPos);
            const afterText = myField.value.substring(endPos, myField.value.length);
            
            myField.value = beforeText + myValue + afterText;
            
            const newPos = startPos + myValue.length;
            myField.focus();
            myField.setSelectionRange(newPos, newPos);
        }

        function updateDebugDisplay(text) {
            const debugText = document.getElementById('debugText');
            if (debugText) debugText.textContent = text;
        }

        window.onload = () => initEditor(mockProps);
    </script>
</body>
</html>
