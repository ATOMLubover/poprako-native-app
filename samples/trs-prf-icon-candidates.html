<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约单色翻校图标预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
        }
        .icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .icon-card:hover {
            border-color: #000;
        }
        /* 强制单色 */
        svg {
            width: 40px;
            height: 40px;
            stroke: #1a1a1a;
            fill: none;
            stroke-width: 1.5;
            margin-bottom: 1rem;
        }
        .icon-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-white p-12">
    <div class="max-w-5xl mx-auto">
        <header class="mb-12">
            <h1 class="text-2xl font-bold text-gray-900 text-center">简约单色线稿图标方案</h1>
            <p class="text-gray-500 text-center mt-2">统一 1.5px 描边强度 · 纯净视觉 · 适合系统级 UI</p>
        </header>

        <div class="icon-grid">
            <!-- 方案 1: 分栏平行视图 (Split Workflow) -->
            <div class="icon-card">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="1" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                    <line x1="7" y1="9" x2="8" y2="9" />
                    <line x1="7" y1="13" x2="9" y2="13" />
                    <line x1="15" y1="9" x2="17" y2="9" />
                    <line x1="15" y1="13" x2="16" y2="13" />
                </svg>
                <span class="icon-label">分栏对比</span>
            </div>

            <!-- 方案 2: 文本翻译流 (Translation Flow) -->
            <div class="icon-card">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 8h7" />
                    <path d="M7 5v3" />
                    <path d="M4 14q4 0 4-4" />
                    <path d="M11 10q0 4-4 4" />
                    <path d="M13 18l3-6 3 6" />
                    <path d="M15 16h3" />
                    <path d="M2 12c0 5.5 4.5 10 10 10s10-4.5 10-10S17.5 2 12 2" stroke-dasharray="2 2" opacity="0.5" />
                </svg>
                <span class="icon-label">语言转换</span>
            </div>

            <!-- 方案 3: 审阅校对 (Review/Proofread) -->
            <div class="icon-card">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    <path d="M15 5l3 3" />
                </svg>
                <span class="icon-label">精细校对</span>
            </div>

            <!-- 方案 4: 任务验证 (Validated Workspace) -->
            <div class="icon-card">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
                <span class="icon-label">任务校验</span>
            </div>
        </div>

        <div class="mt-16 border-t pt-8">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-6 text-center">集成建议</h2>
            <div class="flex justify-center gap-12 text-gray-600 text-sm">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 border border-gray-400"></div>
                    <span>线条统一 (1.5px - 2px)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 border border-gray-400 rounded-full"></div>
                    <span>圆角一致 (Corner Radius: 1-2px)</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-gray-400"></div>
                    <span>单一色彩 (建议 #1A1A1A)</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
