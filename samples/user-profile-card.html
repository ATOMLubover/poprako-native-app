
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息悬浮窗</title>
    <style>
        /* 引入 Inter 字体和 Tailwind 基础配置 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* 基础重置与背景 */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8; /* 极浅的蓝灰色背景 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 悬浮窗主体样式 */
        .profile-card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 16px; /* 大圆角 */
            padding: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04); /* 柔和阴影 */
            display: flex; /* 使用 Flexbox 进行左右布局 */
            gap: 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 左侧头像容器 */
        .avatar-container {
            flex-shrink: 0; /* 防止头像被压缩 */
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 8px; 
            object-fit: cover;
            border: 3px solid #E6F0F5; /* 增加浅色边框，更显清新 */
            transition: all 0.3s;
        }

        .avatar:hover {
            border-color: #A3C9CC;
            transform: scale(1.05);
        }

        /* 右侧信息容器 */
        .info-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            /* 昵称和标签从顶部开始对齐 */
            align-items: flex-start;
        }

        .nickname {
            font-size: 20px;
            font-weight: 600;
            color: #333333;
            /* 调整边距，因为 user-id 已移除 */
            margin-bottom: 16px; 
            line-height: 1.2;
        }

        /* 标签容器 */
        .tags-container {
            display: flex;
            flex-wrap: wrap; /* 标签自动换行 */
            gap: 8px; /* 标签之间的间距 */
            margin-top: 4px;
            margin-bottom: 0; /* 移除标签容器的底部边距 */
        }
        
        /* 创建时间样式（右对齐并包含图标） */
        .created-at {
            font-size: 13px;
            color: #7d8995;
            margin-top: 15px;
            line-height: 1;
            width: 100%; /* 确保占据所有可用宽度 */
            display: flex;
            justify-content: flex-end; /* 右对齐内容 */
            align-items: center;
        }
        
        .created-at .clock-icon {
            /* 使用时钟图标（Unicode 字符） */
            margin-right: 6px;
            font-size: 14px;
            line-height: 1;
            color: #7d8995;
        }

        /* --------------------------------------------------
           集成用户提供的 Tag 按钮样式 (Morning Mist 主题)
           --------------------------------------------------
        */
        .nature-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px; /* 调整内边距使其更紧凑 */
            border: 2px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            font-size: 14px; /* 调整字体大小 */
            font-weight: 500;
            line-height: 1;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap; /* 防止标签文本换行 */
        }

        .nature-tag:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .nature-tag:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* 方案一：晨雾绿 (Morning Mist) */
        .theme-mist {
            background-color: #E3F2E5; 
            border-color: #C8E6C9; 
            color: #749577; 
        }
        .theme-mist:hover {
            background-color: #D1E8D5;
            border-color: #bce0bd; 
        }

        /* 针对修改按钮的特殊调整，使其更像一个图标按钮 */
        .edit-tag-button {
            background-color: #F0F4F8; /* 浅灰色背景，作为功能按钮 */
            border-color: #DDE2E7;
            color: #5A6978; 
            padding: 6px 8px; /* 调整为更适合图标的内边距，使其更方正 */
        }
        .edit-tag-button:hover {
            background-color: #E6EAF0;
            border-color: #C7CDD4;
            color: #333333;
        }
        /* 确保 SVG 居中 */
        .edit-tag-button svg {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 用户信息悬浮窗的主体 -->
    <div class="profile-card">
        <!-- 左侧：头像 -->
        <div class="avatar-container">
            <img id="user-avatar" class="avatar" src="https://placehold.co/72x72/81C784/ffffff?text=L" alt="用户头像" onerror="this.onerror=null;this.src='https://placehold.co/72x72/A3C9CC/ffffff?text=U'">
        </div>

        <!-- 右侧：昵称、标签和创建日期 -->
        <div class="info-container">
            <!-- 第一行：昵称 -->
            <span id="user-nickname" class="nickname">加载中...</span>

            <!-- 第二行及以后：Tags -->
            <div id="user-tags" class="tags-container">
                <!-- Tags and Edit Button will be dynamically injected here -->
            </div>

            <!-- 底部：创建时间 -->
            <span id="user-created-at" class="created-at"></span>
        </div>
    </div>

    <script>
        /**
         * 模拟要注入的用户数据
         */
        const mockUserProfile = {
            userId: "u-12345678",
            nickname: "林深时见鹿",
            tags: [
                { tagId: "t-001", name: "黑长直" },
                { tagId: "t-002", name: "萝莉" },
                { tagId: "t-003", name: "纯爱" },
                { tagId: "t-004", name: "御姐" },
                { tagId: "t-005", name: "双马尾" },
            ],
            avatarUrl: "https://placehold.co/72x72/81C784/ffffff?text=L", // 使用一个清新自然的颜色占位图
            createdAt: new Date(Date.now() - 365 * 24 * 60 * 60 * 1000), // 假设创建于一年前
            isMe: true, // 权限标志：是否为当前用户
        };

        /**
         * 渲染用户信息到悬浮窗
         * @param {object} profile - 用户信息对象
         */
        function renderProfile(profile) {
            const avatarEl = document.getElementById('user-avatar');
            const nicknameEl = document.getElementById('user-nickname');
            const tagsEl = document.getElementById('user-tags');
            const createdAtEl = document.getElementById('user-created-at');

            // 1. 渲染基础信息
            avatarEl.src = profile.avatarUrl;
            nicknameEl.textContent = profile.nickname;
            
            // 2. 格式化创建日期并添加时钟图标
            const createdDate = new Date(profile.createdAt);
            const formattedDate = createdDate.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // 替换文本“创建于”为时钟图标（&#x23F1; 是闹钟 Unicode 字符）
            createdAtEl.innerHTML = `<span class="clock-icon">&#x23F1;</span> ${formattedDate}`;

            // 3. 渲染标签
            tagsEl.innerHTML = ''; // 清空旧标签
            profile.tags.forEach(tag => {
                const tagButton = document.createElement('button');
                // 应用 "晨雾绿" 风格
                tagButton.className = 'nature-tag theme-mist'; 
                tagButton.setAttribute('data-tag-id', tag.tagId); 
                tagButton.title = tag.name;
                
                const tagLabel = document.createElement('span');
                tagLabel.className = 'tag-label';
                tagLabel.textContent = tag.name;

                tagButton.appendChild(tagLabel);
                tagsEl.appendChild(tagButton);
            });

            // 4. 添加修改标签按钮 (基于 isMe 权限)
            if (profile.isMe) {
                const editButton = document.createElement('button');
                // 使用 edit-tag-button 样式，并复用 nature-tag 基础
                editButton.className = 'nature-tag edit-tag-button'; 
                editButton.title = '修改标签';
                
                // 替换为 inline SVG icon (铅笔/编辑符号)
                editButton.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                        <path d="m15 5 4 4"/>
                    </svg>
                `; 
                
                // 模拟点击事件（使用自定义模态框或反馈）
                editButton.onclick = () => {
                    const statusMessage = document.createElement('div');
                    statusMessage.textContent = '编辑标签功能已触发 (SVG 图标点击)。';
                    statusMessage.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #fff; padding: 10px 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000;';
                    document.body.appendChild(statusMessage);
                    setTimeout(() => statusMessage.remove(), 2000);
                };

                tagsEl.appendChild(editButton);
            }
        }

        // 页面加载完成后执行渲染
        document.addEventListener('DOMContentLoaded', () => {
            renderProfile(mockUserProfile);
        });
    </script>
</body>
</html>
