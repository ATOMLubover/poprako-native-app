<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑个人资料</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .modifier-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #2d3748;
            font-weight: 600;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #a0aec0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #718096;
            margin-bottom: 8px;
            font-weight: 600;
            padding-left: 4px;
        }

        /* 晨雾绿风格输入框 */
        .input-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #edf2f7;
            border-radius: 16px;
            font-size: 15px;
            color: #4a5568;
            box-sizing: border-box;
            transition: all 0.25s ease;
            background-color: #f8fafc;
        }

        .input-control:focus {
            outline: none;
            border-color: #C8E6C9; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(200, 230, 201, 0.25);
        }

        .input-control::placeholder {
            color: #cbd5e0;
        }

        textarea.input-control {
            resize: none;
            height: 100px;
            line-height: 1.6;
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-save {
            background-color: #E3F2E5; 
            color: #537056;
            border: 1px solid #C8E6C9;
        }

        .btn-save:hover {
            background-color: #D1E8D5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(200, 230, 201, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        /* 字数统计 */
        .counter {
            font-size: 11px;
            color: #cbd5e0;
            text-align: right;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="modifier-card">
        <div class="header">
            <h2>编辑个人资料</h2>
        </div>

        <div class="form-group">
            <label for="edit-nickname">昵称</label>
            <input type="text" id="edit-nickname" class="input-control" maxlength="20" placeholder="想个好听的名字" value="林深时见鹿">
        </div>

        <div class="form-group">
            <label for="edit-signature">个性签名</label>
            <textarea id="edit-signature" class="input-control" maxlength="15" placeholder="一句话介绍你自己..."></textarea>
            <div class="counter" id="sig-counter">0/15</div>
        </div>

        <div class="button-group">
            <button class="btn btn-cancel">取消</button>
            <button class="btn btn-save" id="save-btn">保存更改</button>
        </div>
    </div>

    <script>
        const sigInput = document.getElementById('edit-signature');
        const sigCounter = document.getElementById('sig-counter');
        const initialSig = "树深时见鹿，溪午不闻钟。";

        // 初始化
        sigInput.value = initialSig;
        sigCounter.textContent = `${initialSig.length}/15`;

        // 监听输入
        sigInput.oninput = () => {
            sigCounter.textContent = `${sigInput.value.length}/15`;
        };

        // 保存逻辑
        document.getElementById('save-btn').onclick = function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // 简单动效反馈
            btn.disabled = true;
            btn.innerHTML = '保存中...';
            
            setTimeout(() => {
                btn.innerHTML = '已保存 ✓';
                btn.style.backgroundColor = '#C8E6C9';
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.style.backgroundColor = '';
                    btn.disabled = false;
                }, 1500);
            }, 800);
        };
    </script>
</body>
</html>
